# Keep the library and docs as separate projects with separate lockfiles.
packages:
  - '.'

# Wait 24 hours for direct and transitive third-party releases, including
# exact versions and frozen installs. Missing publication times are rejected.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Maintained by the repository owner; their third-party dependencies still wait.
  - '@http-client-toolkit/*'

allowBuilds:
  esbuild: true

# Vite+ and its core alias must move together; checked by check:toolchain.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  vitest: 5.0.3

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  # dotenvx's v3 proxy agent pulls unpatched sprintf-js through roarr.
  # v4.1 removes roarr; test:env checks its proxy bootstrap API locally.
  '@dotenvx/dotenvx>global-agent': ^4.1.3

peerDependencyRules:
  allowedVersions:
    vite: '*'
    vitest: '*'
  allowAny:
    - vite
    - vitest

# Match comic-vine: save exact versions when adding dependencies.
saveExact: true
