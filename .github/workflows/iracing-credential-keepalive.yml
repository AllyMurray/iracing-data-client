name: iRacing Credential Keepalive

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iracing-credential-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.x

      - name: Set up pinned Bun
        run: npm install --global "bun@$(cat "$GITHUB_WORKSPACE/.bun-version")"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Keep iRacing OAuth credentials active
        run: ./node_modules/.bin/tsx scripts/keepalive-oauth-clients.ts
        env:
          IRACING_USERNAME: ${{ vars.IRACING_USERNAME }}
          IRACING_PASSWORD: ${{ secrets.IRACING_PASSWORD }}
          IRACING_KEEPALIVE_CLIENTS: ${{ secrets.IRACING_KEEPALIVE_CLIENTS }}
