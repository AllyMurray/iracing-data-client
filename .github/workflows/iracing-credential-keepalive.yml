name: iRacing Credential Keepalive

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iracing-credential-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore encrypted .env
        run: printf '%s' "$DOTENV_ENV_FILE" > .env
        env:
          DOTENV_ENV_FILE: ${{ secrets.DOTENV_ENV_FILE }}

      - name: Keep iRacing OAuth credentials active
        run: pnpm run credentials:keepalive
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
