name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit library and development dependencies
        if: matrix.node-version == '24.x'
        run: pnpm audit

      - name: Verify dependency release-age policy
        if: matrix.node-version == '24.x'
        run: pnpm test:dependency-policy

      - name: Regenerate SDK
        run: pnpm run sdk:generate

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: No unknown service return types
        run: pnpm run sdk:check-no-unknown

      - name: Check formatting and lint
        if: matrix.node-version == '24.x'
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build library on Node 24
        run: pnpm run build

      - name: Test release preparation and recovery without publishing
        if: matrix.node-version == '24.x'
        run: pnpm run test:release

      - name: Setup consumer runtime
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Unit tests
        run: pnpm test run

      - name: Check encrypted environment compatibility
        run: pnpm test:env

      - name: Test installed package on consumer runtime
        run: pnpm run test:package:artifacts

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm build

      - name: Audit documentation dependencies
        run: pnpm audit
