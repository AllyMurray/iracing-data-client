name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate SDK
        run: pnpm run sdk:generate

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: No unknown service return types
        run: pnpm run sdk:check-no-unknown

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test run
