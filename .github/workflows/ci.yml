name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    env:
      CI: "true"
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit library and development dependencies
        if: matrix.node-version == '24.x'
        run: pnpm audit

      - name: Verify dependency release-age policy
        if: matrix.node-version == '24.x'
        run: pnpm test:dependency-policy

      - name: Regenerate SDK
        run: pnpm run sdk:generate

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: No unknown service return types
        run: pnpm run sdk:check-no-unknown

      - name: Check formatting and lint
        if: matrix.node-version == '24.x'
        run: pnpm run check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build library on Node 24
        run: pnpm run build

      - name: Check package size budgets
        run: pnpm run test:build:size

      - name: Test release preparation and recovery without publishing
        if: matrix.node-version == '24.x'
        run: pnpm run test:release

      - name: Setup consumer runtime
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Unit tests
        run: pnpm test run

      - name: Check encrypted environment compatibility
        run: pnpm test:env

      - name: Test installed package on consumer runtime
        run: pnpm run test:package:artifacts

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm build

      - name: Audit documentation dependencies
        run: pnpm audit

  report-candidate-status:
    # GitHub excludes workflow_dispatch job checks from ruleset enforcement.
    # Publish commit statuses backed by the completed jobs on this exact SHA.
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [validate, docs]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Report candidate CI results for branch protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")
          for context in 'validate (22.x)' 'validate (24.x)' 'docs'; do
            state=failure
            if jq -e --arg name "$context" --arg sha "$GITHUB_SHA" '
              [.jobs[] | select(.name == $name and .head_sha == $sha)] |
              length == 1 and .[0].status == "completed" and .[0].conclusion == "success"
            ' <<< "$jobs" > /dev/null; then
              state=success
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$state" -f context="$context" \
              -f description='Result of the exact candidate CI job' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              > /dev/null
          done
